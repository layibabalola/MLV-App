version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 2
    groups:
      routine-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories:
      - "/.github/requirements"
      - "/tools/agent-bridge"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 2
    ignore:
      # The lock compiler is policy, not an ordinary runtime dependency. Its
      # pin, generated bootstrap lock, updater assertion, and lock format must
      # move together in one reviewed manual change.
      - dependency-name: "pip-tools"
    groups:
      routine-python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
