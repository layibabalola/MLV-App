name: Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DIR:   ${{ github.workspace }}\platform
  ARTIFACT:     ${{ github.workspace }}\platform\build\MLVApp\MLVApp.Win64.zip

jobs:
  build:

    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: Set up Python for payload verification
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: ".python-version"

    - name: Install hash-locked payload verification dependencies
      run: |
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/pip.txt
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/repo-hygiene.txt
        python -m pip check

    - name: Verify vendored native payload integrity
      run: python -m tools.repo_hygiene.vendored_native_payloads --repo-root .

    - name: Install OpenSSL
      run: |
           choco install openssl
           if (-not (Test-Path -LiteralPath "C:\Program Files\OpenSSL\bin")) {
             throw "OpenSSL installation did not produce the expected bin directory"
           }
           Get-ChildItem -LiteralPath "C:\Program Files\OpenSSL\bin"
              
    - name: Install Qt
      run: |
           choco install qt5-default
           dir C:\Qt\5.15.2\mingw81_64\bin
           dir C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin

    - name: Create build directory
      run:  mkdir ${{ env.SOURCE_DIR }}\build

    - name: Build
      working-directory: ${{ env.SOURCE_DIR }}\build
      run:  |
            C:\Qt\5.15.2\mingw81_64\bin\qmake.exe -r ${{ env.SOURCE_DIR }}\qt\MLVApp.pro
            make.exe
            dir
            cd release
            C:\Qt\5.15.2\mingw81_64\bin\windeployqt MLVApp.exe
            copy C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\libgomp-1.dll .
            Copy-Item -Path "C:\Program Files\OpenSSL\bin\libcrypto*" -Destination . -ErrorAction Stop
            Copy-Item -Path "C:\Program Files\OpenSSL\bin\libssl*" -Destination . -ErrorAction Stop
            dir

    - name: Install verified FFMPEG
      run:  |
            python -m tools.repo_hygiene.extract_vendored_native_payload --repo-root "${{ github.workspace }}" --payload-id ffmpeg-windows-x86_64 --archive-reference ffmpegWin64.zip --output-dir "${{ env.SOURCE_DIR }}\build\release" --verify-installed

    - name: Install verified RAW2MLV
      run:  |
            python -m tools.repo_hygiene.extract_vendored_native_payload --repo-root "${{ github.workspace }}" --payload-id raw2mlv-windows-x86-compat --archive-reference raw2mlvWin64.zip --output-dir "${{ env.SOURCE_DIR }}\build\release" --verify-installed
            dir ${{ env.SOURCE_DIR }}\build\release

    - name: Rename release folder
      working-directory: ${{ env.SOURCE_DIR }}\build
      run: |
           ren release MLVApp
           dir

    - name: Save build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: MLVApp Windows 64bit
        path: ${{ env.SOURCE_DIR }}\build\MLVApp
