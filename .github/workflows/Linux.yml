name: Linux Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DIR:   ${{ github.workspace }}/platform
  ARTIFACT:     ${{ github.workspace }}/platform/build/MLVApp.AppImage
  QT_VERSION:   6.10.2

jobs:
  build:

    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: Set up Python for payload verification
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: ".python-version"

    - name: Install hash-locked Python dependencies
      timeout-minutes: 15
      run: |
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/pip.txt
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/repo-hygiene.txt
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/aqtinstall.txt
        python -m pip check

    - name: Verify vendored native payload integrity
      run: python -m tools.repo_hygiene.vendored_native_payloads --repo-root .

    - name: Install compiler & Qt
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 \
            libgl1-mesa-dev libegl1 libpulse-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-shape0 \
            libfuse2t64 appstream
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

    - name: Install Qt 6.10.2
      working-directory: ${{ runner.temp }}
      run: |
           set -euo pipefail
           export QT_OUTPUT_DIR="${RUNNER_TEMP}/mlv-release-qt"
           echo "QT_OUTPUT_DIR=${QT_OUTPUT_DIR}" >> "${GITHUB_ENV}"
           qt_install_root="${QT_OUTPUT_DIR}/${QT_VERSION}"
           qt_root="${qt_install_root}/gcc_64"
           qt_qmake="${qt_root}/bin/qmake"
           qt_ready=0
           for attempt in 1 2 3; do
             rm -rf "${qt_install_root}"
             if [ -d "${qt_install_root}" ]; then echo "Qt retry cleanup did not remove ${qt_install_root}" >&2; exit 1; fi
             if python -m aqt install-qt --outputdir "${QT_OUTPUT_DIR}" linux desktop "${QT_VERSION}" linux_gcc_64 -m qtmultimedia && [ -x "${qt_qmake}" ]; then
               qt_ready=1
               break
             fi
             sleep $((5 * attempt))
           done
           if [ "${qt_ready}" -ne 1 ]; then echo "aqt Qt install failed or qmake is missing after 3 attempts" >&2; exit 1; fi
           echo "QT_ROOT_DIR=${qt_root}" >> "${GITHUB_ENV}"
           echo "${qt_root}/bin" >> "${GITHUB_PATH}"

    - name: Verify required Qt multimedia plugins
      run: |
           set -euo pipefail
           export PATH="${QT_ROOT_DIR}/bin:${PATH}"
           export CC=gcc-13
           export CXX=g++-13
           command -v qmake
           qmake -v
           command -v make
           make --version
           command -v g++
           g++ --version
           compiler_major="$(g++ -dumpversion | cut -d. -f1)"
           if [ "${compiler_major}" != "13" ]; then
             echo "expected native GCC major version 13, observed ${compiler_major}" >&2
             exit 1
           fi
           qt_version="$(qmake -query QT_VERSION)"
           if [ "${qt_version}" != "${QT_VERSION}" ]; then
             echo "expected Qt ${QT_VERSION}, observed ${qt_version}" >&2
             exit 1
           fi
           plugin_root="$(qmake -query QT_INSTALL_PLUGINS)"
           required_directories=(multimedia)
           required_plugins=(
             multimedia/libffmpegmediaplugin.so
           )
           for directory in "${required_directories[@]}"; do
             test -d "${plugin_root}/${directory}"
           done
           for plugin in "${required_plugins[@]}"; do
             test -f "${plugin_root}/${plugin}"
           done

    - name: Verify Qt Linux runtime dependencies
      run: |
           set -euo pipefail
           export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
           report="${RUNNER_TEMP}/qt-runtime-dependencies.txt"
           : > "${report}"
           libraries=(
             "${QT_ROOT_DIR}/lib/libQt6Multimedia.so"
             "${QT_ROOT_DIR}/plugins/multimedia/libffmpegmediaplugin.so"
           )
           for library in "${libraries[@]}"; do
             test -f "${library}"
             printf 'Library=%s\n' "${library}" | tee -a "${report}"
             ldd "${library}" | tee -a "${report}"
           done
           if grep -Fq 'not found' "${report}"; then
             echo "Qt Linux runtime dependencies are missing; see ${report}" >&2
             exit 1
           fi

    - name: Create build directory
      run:  mkdir ${{ env.SOURCE_DIR }}/build

    - name: Build
      working-directory: ${{ env.SOURCE_DIR }}/build
      env:
        CC: gcc-13
        CXX: g++-13
      run:  |
            set -euo pipefail
            export PATH="${QT_ROOT_DIR}/bin:${PATH}"
            python "${{ github.workspace }}/tools/release/build_stamp.py" generate --repo-root "${GITHUB_WORKSPACE}" --expected-sha "${GITHUB_SHA}" --output-header "${{ env.SOURCE_DIR }}/build/build_buildinfo.h"
            qmake ${{ env.SOURCE_DIR }}/qt/MLVApp.pro
            generated_cxxflags="$(sed -n 's/^CXXFLAGS[[:space:]]*=[[:space:]]*//p' Makefile | head -n 1)"
            echo "generated CXXFLAGS=${generated_cxxflags}"
            case " ${generated_cxxflags} " in
              *" -std=c++17 "*) ;;
              *) echo "qmake did not generate -std=c++17 for Linux Qt ${QT_VERSION}" >&2; exit 1 ;;
            esac
            case " ${generated_cxxflags} " in
              *" -std=c++11 "*) echo "qmake retained conflicting -std=c++11 for Linux Qt ${QT_VERSION}" >&2; exit 1 ;;
            esac
            make -j8
            python "${{ github.workspace }}/tools/release/build_stamp.py" verify --binary "${{ env.SOURCE_DIR }}/build/mlvapp" --expected-sha "${GITHUB_SHA}"
            ls -al
            mkdir image
            cd image
            cp ${{ env.SOURCE_DIR }}/qt/RetinaIMG/MLVAPP.png .
            cp ${{ env.SOURCE_DIR }}/qt/mlvapp.desktop .
            ls -al
            mkdir usr
            cd usr
            mkdir bin
            cd bin
            PYTHONPATH="${{ github.workspace }}" python -m tools.repo_hygiene.extract_vendored_native_payload --repo-root "${{ github.workspace }}" --payload-id ffmpeg-linux-x86_64 --archive-reference ffmpegLinux.tar.xz --output-dir . --verify-installed
            PYTHONPATH="${{ github.workspace }}" python -m tools.repo_hygiene.extract_vendored_native_payload --repo-root "${{ github.workspace }}" --payload-id raw2mlv-linux-x86_64 --archive-reference raw2mlvLinux.tar.xz --output-dir . --verify-installed
            ls -al

    - name: Copy Qt multimedia plugins
      working-directory: ${{ env.SOURCE_DIR }}/build
      run: |
           set -euo pipefail
           plugin_root="$(qmake -query QT_INSTALL_PLUGINS)"
           required_directories=(multimedia)
           required_plugins=(
             multimedia/libffmpegmediaplugin.so
           )
           for directory in "${required_directories[@]}"; do
             source_directory="${plugin_root}/${directory}"
             destination_directory="image/usr/plugins/${directory}"
             test -d "${source_directory}"
             mkdir -p "${destination_directory}"
             cp -a "${source_directory}/." "${destination_directory}/"
           done
           for plugin in "${required_plugins[@]}"; do
             test -f "image/usr/plugins/${plugin}"
           done

    - name: Install pinned LinuxDeploy tools
      shell: bash
      run: |
           set -euo pipefail
           tools_dir="${RUNNER_TEMP}/linuxdeploy-tools"
           mkdir -p "${tools_dir}"
           curl --fail --location --retry 5 --retry-all-errors \
             --output "${tools_dir}/linuxdeploy-x86_64.AppImage" \
             "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
           curl --fail --location --retry 5 --retry-all-errors \
             --output "${tools_dir}/linuxdeploy-plugin-qt-x86_64.AppImage" \
             "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage"
           curl --fail --location --retry 5 --retry-all-errors \
             --output "${tools_dir}/linuxdeploy-plugin-appimage-x86_64.AppImage" \
             "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage"
           cat > "${tools_dir}/SHA256SUMS" <<'EOF'
           c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
           15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
           992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3  linuxdeploy-plugin-appimage-x86_64.AppImage
           EOF
           (
             cd "${tools_dir}"
             sha256sum -c SHA256SUMS
             chmod +x linuxdeploy-x86_64.AppImage \
               linuxdeploy-plugin-qt-x86_64.AppImage \
               linuxdeploy-plugin-appimage-x86_64.AppImage
           )
           printf '%s\n' "${tools_dir}" >> "${GITHUB_PATH}"

    - name: Create Appimage
      working-directory: ${{ env.SOURCE_DIR }}/build
      run: |
           set -euo pipefail
           export QT_PLUGIN_PATH="$(qmake -query QT_INSTALL_PLUGINS)"
           linuxdeploy-x86_64.AppImage --desktop-file=image/mlvapp.desktop --executable=mlvapp --appdir=image --plugin=qt --output=appimage --verbosity=3 --icon-file=image/MLVAPP.png
           python "${{ github.workspace }}/tools/release/build_stamp.py" verify --binary "${{ env.SOURCE_DIR }}/build/image/usr/bin/mlvapp" --expected-sha "${GITHUB_SHA}"
           cp MLVApp-*.AppImage ${{ env.ARTIFACT }}

    - name: Print toolchain
      run: |
           set -euo pipefail
           qt_version="$(qmake -query QT_VERSION)"
           compiler_version="$(g++ -dumpfullversion -dumpversion)"
           echo "qmake QT_VERSION=${qt_version}"
           echo "g++ version=${compiler_version}"
           if [ "${qt_version}" != "6.10.2" ]; then
             echo "Print toolchain: expected Qt 6.10.2, observed '${qt_version}'" >&2
             exit 1
           fi
           compiler_major="$(g++ -dumpversion | cut -d. -f1)"
           if [ "${compiler_major}" != "13" ]; then
             echo "Print toolchain: expected native GCC major 13, observed '${compiler_major}'" >&2
             exit 1
           fi
           toolchain_log="${RUNNER_TEMP}/toolchain-log.txt"
           {
             echo "QT_VERSION=${qt_version}"
             echo "COMPILER_VERSION=${compiler_version}"
             echo "QMAKE_EXE=$(command -v qmake)"
             echo "GXX_EXE=$(command -v g++)"
           } > "${toolchain_log}"
           echo "TOOLCHAIN_LOG=${toolchain_log}" >> "${GITHUB_ENV}"

    - name: Upload toolchain receipt
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: toolchain-receipt-${{ github.run_id }}
        path: ${{ env.TOOLCHAIN_LOG }}
        if-no-files-found: error

    - name: Generate single-build release evidence
      run: |
           QMAKE_PATH="$(command -v qmake)"
           COMPILER_PATH="$(command -v g++)"
           LINUXDEPLOY_PATH="$(command -v linuxdeploy-x86_64.AppImage)"
           LINUXDEPLOY_QT_PATH="$(command -v linuxdeploy-plugin-qt-x86_64.AppImage)"
           LINUXDEPLOY_APPIMAGE_PATH="$(command -v linuxdeploy-plugin-appimage-x86_64.AppImage)"
           QT_VERSION="$(${QMAKE_PATH} -query QT_VERSION)"
           COMPILER_VERSION="$(${COMPILER_PATH} -dumpfullversion -dumpversion)"
           python -m tools.release.release_evidence \
             --repo-root "${{ github.workspace }}" \
             --product "${{ env.ARTIFACT }}" \
             --inventory-root "${{ env.SOURCE_DIR }}/build/image" \
             --expected-main "usr/bin/mlvapp" \
             --output-dir "${{ runner.temp }}/release-evidence" \
             --label "linux-x86_64" \
             --target-os "linux" \
             --target-arch "x86_64" \
             --repository "${{ github.repository }}" \
             --source-ref "${{ github.ref }}" \
             --commit "${{ github.sha }}" \
             --run-id "${{ github.run_id }}" \
             --run-attempt "${{ github.run_attempt }}" \
             --runner-os "${{ runner.os }}" \
             --runner-arch "${{ runner.arch }}" \
             --runner-name "${{ runner.name }}" \
             --runner-image-os "${ImageOS}" \
             --runner-image-version "${ImageVersion}" \
             --tool "qmake=${QMAKE_PATH}" \
             --tool "compiler=${COMPILER_PATH}" \
             --tool "linuxdeploy=${LINUXDEPLOY_PATH}" \
             --tool "linuxdeploy-plugin-qt=${LINUXDEPLOY_QT_PATH}" \
             --tool "linuxdeploy-plugin-appimage=${LINUXDEPLOY_APPIMAGE_PATH}" \
             --tool-version "qmake=${QT_VERSION}" \
             --tool-version "compiler=${COMPILER_VERSION}" \
             --tool-version "linuxdeploy=1-alpha-20251107-1" \
             --tool-version "linuxdeploy-plugin-qt=1-alpha-20250213-1" \
             --tool-version "linuxdeploy-plugin-appimage=1-alpha-20250213-1"

    - name: Save release evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: MLVApp Linux release evidence
        path: ${{ runner.temp }}/release-evidence
        if-no-files-found: error

    - name: Save build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: MLVApp
        path: ${{ env.ARTIFACT }}
        if-no-files-found: error
