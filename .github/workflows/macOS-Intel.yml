name: macOS Intel Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DIR:   ${{ github.workspace }}/platform
  QTDIR:        /usr/local/opt/qt@5/bin
  ARTIFACT:     ${{ github.workspace }}/platform/build/MLV\ App.dmg

jobs:
  build:

    if: github.ref == 'refs/heads/master'
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: Install llvm & Qt & OpenSSL
      uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
      with:
        brew: llvm qt5 openssl

    - name: Verify macOS build toolchain
      run: |
        test -x "${{ env.QTDIR }}/qmake"
        "${{ env.QTDIR }}/qmake" -v
        LLVM_CXX="$(brew --prefix llvm)/bin/clang++"
        test -x "$LLVM_CXX"
        "$LLVM_CXX" --version

    - name: Set up Python for payload verification
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: ".python-version"

    - name: Install hash-locked payload verification dependencies
      run: |
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/pip.txt
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/repo-hygiene.txt
        python -m pip check

    - name: Verify vendored native payload integrity
      run: python -m tools.repo_hygiene.vendored_native_payloads --repo-root .
              
    - name: Create build directory
      run:  mkdir ${{ env.SOURCE_DIR }}/build

    - name: Build
      working-directory: ${{ env.SOURCE_DIR }}/build
      run:  |
            ${{ env.QTDIR }}/qmake -r ${{ env.SOURCE_DIR }}/qt/MLVApp.pro MLVAPP_SKIP_LEGACY_PAYLOAD_EXTRACTION=1
            make -j8
            ls -al
            PYTHONPATH="${{ github.workspace }}" python -m tools.repo_hygiene.extract_vendored_native_payload --repo-root "${{ github.workspace }}" --payload-id ffmpeg-macos-x86_64 --archive-reference ffmpegOSX.zip --output-dir "MLV App.app/Contents/MacOS" --verify-installed
            PYTHONPATH="${{ github.workspace }}" python -m tools.repo_hygiene.extract_vendored_native_payload --repo-root "${{ github.workspace }}" --payload-id raw2mlv-macos-x86_64 --archive-reference raw2mlvOSX.zip --output-dir "MLV App.app/Contents/MacOS" --verify-installed
            ${{ env.QTDIR }}/macdeployqt MLV\ App.app -dmg

    - name: Save build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: MLVApp macOS Intel
        path: ${{ env.ARTIFACT }}
