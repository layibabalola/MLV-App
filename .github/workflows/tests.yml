name: Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - "tests/**"
      - "src/**"
      - "platform/qt/**"
      - "tools/repo_hygiene/**"
      - "tools/repo-hygiene/**"
      - "tools/profiling/**"
      - "tools/agent-bridge/**"
      - "tools/closeout/**"
      - "closeout.config.json"
      - "AGENTS.md"
      - "CLAUDE.md"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/tests.yml"
      - "tests/**"
      - "src/**"
      - "platform/qt/**"
      - "tools/repo_hygiene/**"
      - "tools/repo-hygiene/**"
      - "tools/profiling/**"
      - "tools/agent-bridge/**"
      - "tools/closeout/**"
      - "closeout.config.json"
      - "AGENTS.md"
      - "CLAUDE.md"

jobs:
  repo-hygiene-python:
    name: Repo Hygiene Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repo hygiene test dependencies
        run: python -m pip install jsonschema

      - name: Run repo hygiene Python tests
        run: |
          python -m unittest tools.repo_hygiene.test_repo_hygiene -v
          python -m unittest tools.repo_hygiene.test_brokered_closeout -v
          python tools/repo-hygiene/hygiene.py --repo-root . verify-policy

  windows-scaffold:
    name: Windows Scaffold
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    env:
      QT_VERSION: 6.10.2
      QT_OUTPUT_DIR: ${{ github.workspace }}\qt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install blocking Python test dependencies
        run: |
          python -m pip install jsonschema
          python -m pip install -r tools\agent-bridge\requirements.txt

      - name: Run repo hygiene Python tests
        run: |
          python -m unittest tools.repo_hygiene.test_repo_hygiene -v
          python -m unittest tools.repo_hygiene.test_brokered_closeout -v
          python tools\repo-hygiene\hygiene.py --repo-root . verify-policy

      - name: Run agent bridge PowerShell launcher regressions
        run: |
          python -m unittest `
            tools.agent-bridge.test_agent_bridge.AgentBridgeTests.test_mcp_server_watchdog_throttles_wrapper_identity_checks `
            tools.agent-bridge.test_agent_bridge.AgentBridgeTests.test_codex_hooks_assert_bridge_cli_contract `
            tools.agent-bridge.test_agent_bridge.AgentBridgeTests.test_wake_codex_input_size_smoke_runs_under_powershell `
            tools.agent-bridge.test_agent_bridge.AgentBridgeTests.test_configure_watcher_targeted_sendkeys_provider_writes_delivery_priority_helper_template `
            tools.agent-bridge.test_agent_bridge.AgentBridgeTests.test_bootstrap_watcher_enumeration_prefers_pwsh_for_cim `
            tools.agent-bridge.test_agent_bridge.AgentBridgeTests.test_windows_toast_uses_expiry_and_tray_cap_settings `
            tools.agent-bridge.test_agent_bridge.AgentBridgeTests.test_windows_toast_tag_sanitizes_ps_line_breaks `
            tools.agent-bridge.test_agent_bridge.AgentBridgeTests.test_windows_balloon_fallback_uses_encoded_command `
            tools.agent-bridge.test_server_wrapper_phase2.ServerWrapperPhase2Tests.test_windows_process_table_queries_prefer_pwsh_for_cim `
            tools.agent-bridge.test_server_wrapper_phase2.ServerWrapperPhase2Tests.test_windows_process_table_uses_pwsh_alias_when_exe_probe_is_absent `
            tools.agent-bridge.test_server_wrapper_phase2.ServerWrapperPhase2Tests.test_windows_process_table_queries_fall_back_to_windows_powershell `
            tools.agent-bridge.test_server_wrapper_phase2.ServerWrapperPhase2Tests.test_trampoline_host_env_queries_prefer_pwsh_for_cim `
            tools.agent-bridge.test_server_wrapper_phase2.ServerWrapperPhase2Tests.test_server_wrapper_process_entry_prefers_pwsh_for_cim `
            tools.agent-bridge.test_server_wrapper_phase2.ServerWrapperPhase2Tests.test_supervisor_throttles_host_identity_revalidation `
            -v

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.*"

      - name: Install Qt 6.10.2 + MinGW 13.1
        run: |
          python -m aqt install-qt --outputdir "$env:QT_OUTPUT_DIR" windows desktop "$env:QT_VERSION" win64_mingw
          python -m aqt install-tool --outputdir "$env:QT_OUTPUT_DIR" windows desktop tools_mingw1310 qt.tools.win64_mingw1310
          Add-Content -Path $env:GITHUB_ENV -Value "QT_ROOT_DIR=$env:QT_OUTPUT_DIR\\$env:QT_VERSION\\mingw_64"
          Add-Content -Path $env:GITHUB_ENV -Value "MINGW_ROOT=$env:QT_OUTPUT_DIR\\Tools\\mingw1310_64"

      - name: Build console_tests
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          New-Item -ItemType Directory -Force tests\build-ci-console | Out-Null
          Push-Location tests\build-ci-console
          & "$env:QT_ROOT_DIR\bin\qmake.exe" "..\console\console_tests.pro"
          & "$env:MINGW_ROOT\bin\mingw32-make.exe" -j2
          Pop-Location

      - name: Run console_tests --check-golden
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          & "tests\build-ci-console\release\console_tests.exe" --check-golden

      - name: Build pipeline_tests
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          New-Item -ItemType Directory -Force tests\build-ci-pipeline | Out-Null
          Push-Location tests\build-ci-pipeline
          & "$env:QT_ROOT_DIR\bin\qmake.exe" "..\pipeline\pipeline_tests.pro"
          & "$env:MINGW_ROOT\bin\mingw32-make.exe" -j2
          Pop-Location

      - name: Run pipeline_tests --check-golden (bounded shards)
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          $env:MLVAPP_CRASH_FORENSICS_AUTOINSTALL = "1"
          $env:MLVAPP_CRASH_FORENSICS_LOG_DIR = Join-Path $env:RUNNER_TEMP "pipeline-crash-forensics"
          New-Item -ItemType Directory -Force $env:MLVAPP_CRASH_FORENSICS_LOG_DIR | Out-Null
          $suiteOutput = Join-Path $env:RUNNER_TEMP "pipeline-tests-output.txt"
          New-Item -ItemType File -Force $suiteOutput | Out-Null
          # Build deterministic exact-name shards from the source registry.
          # The former suite-wide shard could exceed the 300-second venue bound
          # and hide failures behind the timeout. Exact names keep every test
          # covered while bounding each child independently.
          $testNames = @(
            foreach ($file in Get-ChildItem tests\pipeline -Filter *.cpp) {
              $text = Get-Content -LiteralPath $file.FullName -Raw
              foreach ($match in [regex]::Matches($text, 'TEST(?:_[FP])?\(\s*([A-Za-z0-9_]+)\s*,\s*([A-Za-z0-9_]+)')) {
                "{0}.{1}" -f $match.Groups[1].Value.Trim(), $match.Groups[2].Value.Trim()
              }
            }
          ) | Sort-Object -Unique
          if ($testNames.Count -eq 0) { throw "pipeline test registry discovery returned no tests" }
          $testsPerShard = 24
          $shards = @()
          for ($offset = 0; $offset -lt $testNames.Count; $offset += $testsPerShard) {
            $end = [Math]::Min($offset + $testsPerShard, $testNames.Count)
            $filter = ($testNames[$offset..($end - 1)] -join ':')
            $shards += @{ Name = ("exact-{0:D2}" -f [int]($offset / $testsPerShard)); Filter = $filter }
          }
          function Invoke-BoundedPipelineShard {
            param([string]$Name, [string]$Filter, [string]$OutputPath)
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path "tests\build-ci-pipeline\release\pipeline_tests.exe").Path
            $psi.WorkingDirectory = $env:GITHUB_WORKSPACE
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            [void]$psi.ArgumentList.Add("--check-golden")
            [void]$psi.ArgumentList.Add("--gtest_filter=$Filter")
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $psi
            if (-not $process.Start()) { throw "failed to start pipeline shard $Name" }
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(240000)) {
              try { $process.Kill($true) } catch { }
              throw "pipeline shard $Name exceeded 240 seconds"
            }
            $process.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            $combined = $stdout + $stderr
            Set-Content -Path $OutputPath -Value $combined -Encoding utf8
            return [pscustomobject]@{ ExitCode = $process.ExitCode; Output = $combined }
          }
          foreach ($shard in $shards) {
            $shardOutput = Join-Path $env:RUNNER_TEMP ("pipeline-tests-{0}.txt" -f $shard.Name)
            Add-Content -Path $suiteOutput -Value ("===== SHARD {0} FILTER {1} =====" -f $shard.Name, $shard.Filter)
            $shardResult = Invoke-BoundedPipelineShard -Name $shard.Name -Filter $shard.Filter -OutputPath $shardOutput
            Add-Content -Path $suiteOutput -Value ("===== SHARD {0} FILTER {1} EXIT {2} =====" -f $shard.Name, $shard.Filter, $shardResult.ExitCode)
            Add-Content -Path $suiteOutput -Value $shardResult.Output
            Write-Output ("===== SHARD {0} FILTER {1} EXIT {2} =====" -f $shard.Name, $shard.Filter, $shardResult.ExitCode)
            Write-Output $shardResult.Output
            $shardExit = $shardResult.ExitCode

            # Exit 1 means named test failures, which the reviewed manifest
            # adjudicates after all shards. Crashes, usage errors, and
            # golden-oracle errors remain unconditionally blocking.
            if ($shardExit -notin @(0, 1)) {
              throw "pipeline_tests shard $($shard.Name) failed outside the expected-failure contract (exit $shardExit)"
            }
          }

          # Criterion (v): exercise the hosted-like contention that exposed the
          # two prefetch failures. Four concurrent repetitions are an evidence
          # leg, not an expected-failure allowance; every nonzero result is
          # retained in the aggregate log and blocks this job.
          $stressFilter = 'DualIsoPipeline.Processed8PrefetchIndirect*:ProcessingFilters.AggressiveX2PlaybackPreviewUsesQuarterresShadowsHighlights'
          $stressProcesses = @()
          for ($run = 1; $run -le 4; $run++) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path "tests\build-ci-pipeline\release\pipeline_tests.exe").Path
            $psi.WorkingDirectory = $env:GITHUB_WORKSPACE
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            [void]$psi.ArgumentList.Add("--gtest_filter=$stressFilter")
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $psi
            if (-not $process.Start()) { throw "failed to start stress repetition $run" }
            $stressProcesses += [pscustomobject]@{
              Name = "stress-{0:D2}" -f $run
              Process = $process
              Stdout = $process.StandardOutput.ReadToEndAsync()
              Stderr = $process.StandardError.ReadToEndAsync()
            }
          }
          foreach ($stress in $stressProcesses) {
            if (-not $stress.Process.WaitForExit(240000)) {
              try { $stress.Process.Kill($true) } catch { }
              throw "pipeline stress repetition $($stress.Name) exceeded 240 seconds"
            }
            $stress.Process.WaitForExit()
            $stressOutput = $stress.Stdout.GetAwaiter().GetResult() + $stress.Stderr.GetAwaiter().GetResult()
            $stressOutputPath = Join-Path $env:RUNNER_TEMP ("pipeline-tests-{0}.txt" -f $stress.Name)
            Set-Content -Path $stressOutputPath -Value $stressOutput -Encoding utf8
            Add-Content -Path $suiteOutput -Value ("===== STRESS {0} FILTER {1} EXIT {2} =====" -f $stress.Name, $stressFilter, $stress.Process.ExitCode)
            Add-Content -Path $suiteOutput -Value $stressOutput
            Write-Output ("===== STRESS {0} FILTER {1} EXIT {2} =====" -f $stress.Name, $stressFilter, $stress.Process.ExitCode)
            Write-Output $stressOutput
            if ($stress.Process.ExitCode -ne 0) {
              throw "pipeline stress repetition $($stress.Name) failed (exit $($stress.Process.ExitCode))"
            }
          }

          & tools\testing\check-expected-failures.ps1 -SuiteOutput $suiteOutput
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload pipeline crash forensics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-scaffold-pipeline-crash-forensics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}\pipeline-crash-forensics\**
            ${{ runner.temp }}\pipeline-tests-output.txt
            ${{ runner.temp }}\pipeline-tests-*.txt

  windows-gui-pilot:
    name: Windows GUI Pilot
    runs-on: windows-latest
    continue-on-error: true

    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    env:
      QT_VERSION: 6.10.2
      QT_OUTPUT_DIR: ${{ github.workspace }}\qt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.*"

      - name: Install Qt 6.10.2 + MinGW 13.1
        run: |
          python -m aqt install-qt --outputdir "$env:QT_OUTPUT_DIR" windows desktop "$env:QT_VERSION" win64_mingw
          python -m aqt install-tool --outputdir "$env:QT_OUTPUT_DIR" windows desktop tools_mingw1310 qt.tools.win64_mingw1310
          Add-Content -Path $env:GITHUB_ENV -Value "QT_ROOT_DIR=$env:QT_OUTPUT_DIR\$env:QT_VERSION\mingw_64"
          Add-Content -Path $env:GITHUB_ENV -Value "MINGW_ROOT=$env:QT_OUTPUT_DIR\Tools\mingw1310_64"

      - name: Build gui_tests
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          New-Item -ItemType Directory -Force tests\build-ci-gui | Out-Null
          Push-Location tests\build-ci-gui
          & "$env:QT_ROOT_DIR\bin\qmake.exe" "..\gui\gui_tests.pro"
          & "$env:MINGW_ROOT\bin\mingw32-make.exe" -j2
          Pop-Location

      - name: Run gui_tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: desktop
          QT_QPA_PLATFORM_PLUGIN_PATH: ${{ env.QT_ROOT_DIR }}\plugins\platforms
          QT_PLUGIN_PATH: ${{ env.QT_ROOT_DIR }}\plugins
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          & "tests\build-ci-gui\release\gui_tests.exe" -o gui_tests_output.txt,txt
          $ec = $LASTEXITCODE
          Get-Content gui_tests_output.txt
          if ($ec -ne 0) { exit $ec }

      - name: Upload gui_tests log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui_tests_output
          path: gui_tests_output.txt
          if-no-files-found: ignore
