name: Provider control candidate
on:
  pull_request:
    paths:
      - "tools/provider_control/**"
      - ".github/requirements/provider-control*"
      - ".github/workflows/provider-control-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-control-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false
jobs:
  closed-gate:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/provider-control.txt
      - run: python -m unittest tools.provider_control.tests.test_mlv_lane_supervisor -v
      - run: python tools/provider_control/vendor/universal_provider_control.py validate profile tools/provider_control/mlv-project-profile.candidate.json
